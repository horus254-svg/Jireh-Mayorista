# Guardar este archivo en: .github/workflows/generar-seo.yml
#
# 1) Aplica los datos del cliente (config.json → index.html, manifests,
#    robots.txt) — así, para un cliente nuevo alcanza con editar config.json.
# 2) Genera las páginas estáticas de producto (/producto/CODIGO-slug/), las de
#    categoría (/categoria/slug/) y los enlaces visibles de index.html.
# 3) Genera el sitemap, que apunta a esas mismas páginas.
# 4) Verifica (sin red) que todo lo listado existe y es válido; si algo falla,
#    el job se corta ANTES del commit y no se publica nada roto.
# Todo en un solo commit.
# 5) Avisa por IndexNow (Bing, Yandex, Seznam, Naver…) las páginas nuevas,
#    cambiadas o eliminadas. Si ese aviso falla no se rompe nada: se reintenta
#    en el próximo run.
#
# No hace falta configurar secrets: la URL del sitio y la del backend se
# leen de config.json. (Si existen los secrets API_URL / SITE_URL, tienen
# prioridad — útil si no querés que la URL del backend esté en el repo.)

name: Generar SEO (páginas de producto + sitemap)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC (03:00 Argentina)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aplicar datos del cliente (config.json)
        run: node scripts/aplicar-cliente.js

      - name: Generar páginas de producto y categoría (/producto/, /categoria/)
        env:
          API_URL: ${{ secrets.API_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/generar-seo.js

      - name: Generar sitemap.xml
        env:
          API_URL: ${{ secrets.API_URL }}
          BASE_URL: ${{ secrets.SITE_URL }}
        run: node generar-sitemap.js

      - name: Verificar SEO (sitemap, fichas, JSON-LD, canonical, imágenes, enlaces)
        run: node scripts/verificar-seo.js

      - name: Commitear cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A producto categoria sitemap.xml index.html manifest-catalogo.json Reportes/manifest.json robots.txt config.json
          git add -A -- 'google*.html' || true
          git add -A -- ':(glob)*.txt' || true
          git diff --cached --quiet || git commit -m "chore: regenerar SEO de productos [automático]"
          git push

      - name: Avisar a buscadores por IndexNow (Bing, Yandex…)
        continue-on-error: true
        run: node scripts/indexnow.js

      - name: Guardar estado de IndexNow
        run: |
          git add -A .github/indexnow-estado.json || true
          git diff --cached --quiet || (git commit -m "chore: estado IndexNow [automático]" && git push)
